name: ListLift CI and Google Cloud CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listlift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Restore, audit, build, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore with moderate-level NuGet auditing enabled
        run: dotnet restore ./ListLift.sln -p:NuGetAudit=true -p:NuGetAuditLevel=moderate

      - name: List dependency advisories
        shell: pwsh
        run: |
          $report = dotnet list ./ListLift.sln package --vulnerable --include-transitive 2>&1
          $report | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability audit could not complete.' }
          if (($report | Out-String) -match '(?i)NU190[1-4]|has the following vulnerable packages') {
            throw 'NuGet reported a moderate-or-higher vulnerable package. Review the advisory before merging.'
          }

      - name: Build solution
        run: dotnet build ./ListLift.sln --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test ./ListLift.sln --no-build --configuration Release --logger "trx;LogFileName=listlift-tests.trx"

      - name: Build the Cloud Run container
        run: docker build --tag listlift:ci .

  deploy-development:
    name: Deploy Development to Cloud Run
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.GCP_DEV_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: Development
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 40
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
      GCP_DATABASE_SECRET: ${{ vars.GCP_DATABASE_SECRET }}
      GCP_ADMIN_CREDENTIAL_HASH_SECRET: ${{ vars.GCP_ADMIN_CREDENTIAL_HASH_SECRET }}
      GCP_GCS_BUCKET: ${{ vars.GCP_GCS_BUCKET }}
      GCP_KMS_KEY_NAME: ${{ vars.GCP_KMS_KEY_NAME }}
      GCP_RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      GCP_MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
      GCP_CLEANUP_JOB: ${{ vars.GCP_CLEANUP_JOB }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Validate Development deployment settings
        run: |
          for name in GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPOSITORY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT GCP_CLOUD_SQL_INSTANCE GCP_DATABASE_SECRET GCP_ADMIN_CREDENTIAL_HASH_SECRET GCP_GCS_BUCKET GCP_KMS_KEY_NAME GCP_RUN_SERVICE GCP_MIGRATION_JOB GCP_CLEANUP_JOB; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Development environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Build and push container image
        id: image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/listlift:${GITHUB_SHA}"
          docker build --tag "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Apply PostgreSQL migrations
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run jobs update "$GCP_MIGRATION_JOB" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"
          gcloud run jobs execute "$GCP_MIGRATION_JOB" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --wait

      - name: Update scheduled cleanup job image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run jobs update "$GCP_CLEANUP_JOB" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run deploy "$GCP_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --port 8080 \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "$GCP_CLOUD_SQL_INSTANCE" \
            --min 0 \
            --max 1 \
            --update-env-vars "ASPNETCORE_ENVIRONMENT=Production,Database__Provider=PostgreSql,Storage__PhotoProvider=GoogleCloudStorage,Storage__GoogleCloudBucket=${GCP_GCS_BUCKET},Storage__PhotoObjectPrefix=listing-photos,DataProtection__ObjectPrefix=data-protection/listlift,DataProtection__KmsKeyName=${GCP_KMS_KEY_NAME}" \
            --update-secrets "ConnectionStrings__ListingDb=${GCP_DATABASE_SECRET}:latest,Admin__CredentialHash=${GCP_ADMIN_CREDENTIAL_HASH_SECRET}:latest"

      - name: Check Development deployment health
        run: |
          service_url="$(gcloud run services describe "$GCP_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          test -n "$service_url"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "${service_url%/}/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$service_url/"

  deploy-production:
    name: Deploy Production to Cloud Run
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.GCP_PROD_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 40
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
      GCP_DATABASE_SECRET: ${{ vars.GCP_DATABASE_SECRET }}
      GCP_ADMIN_CREDENTIAL_HASH_SECRET: ${{ vars.GCP_ADMIN_CREDENTIAL_HASH_SECRET }}
      GCP_GCS_BUCKET: ${{ vars.GCP_GCS_BUCKET }}
      GCP_KMS_KEY_NAME: ${{ vars.GCP_KMS_KEY_NAME }}
      GCP_RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      GCP_MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
      GCP_CLEANUP_JOB: ${{ vars.GCP_CLEANUP_JOB }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Validate Production deployment settings
        run: |
          for name in GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPOSITORY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT GCP_CLOUD_SQL_INSTANCE GCP_DATABASE_SECRET GCP_ADMIN_CREDENTIAL_HASH_SECRET GCP_GCS_BUCKET GCP_KMS_KEY_NAME GCP_RUN_SERVICE GCP_MIGRATION_JOB GCP_CLEANUP_JOB; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Production environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Build and push container image
        id: image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/listlift:${GITHUB_SHA}"
          docker build --tag "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Apply PostgreSQL migrations
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run jobs update "$GCP_MIGRATION_JOB" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"
          gcloud run jobs execute "$GCP_MIGRATION_JOB" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --wait

      - name: Update scheduled cleanup job image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run jobs update "$GCP_CLEANUP_JOB" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run deploy "$GCP_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --port 8080 \
            --allow-unauthenticated \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "$GCP_CLOUD_SQL_INSTANCE" \
            --min 0 \
            --max 1 \
            --update-env-vars "ASPNETCORE_ENVIRONMENT=Production,Database__Provider=PostgreSql,Storage__PhotoProvider=GoogleCloudStorage,Storage__GoogleCloudBucket=${GCP_GCS_BUCKET},Storage__PhotoObjectPrefix=listing-photos,DataProtection__ObjectPrefix=data-protection/listlift,DataProtection__KmsKeyName=${GCP_KMS_KEY_NAME}" \
            --update-secrets "ConnectionStrings__ListingDb=${GCP_DATABASE_SECRET}:latest,Admin__CredentialHash=${GCP_ADMIN_CREDENTIAL_HASH_SECRET}:latest"

      - name: Check Production deployment health
        run: |
          service_url="$(gcloud run services describe "$GCP_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          test -n "$service_url"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "${service_url%/}/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$service_url/"
